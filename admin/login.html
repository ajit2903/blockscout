<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockscout Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f6f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(400px, calc(100% - 32px));
      padding: 32px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .error {
      margin-top: 16px;
      color: #b00020;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Blockscout Admin</h1>

    <p>
      Sign in with your authorized GitHub account.
    </p>

    <button id="login" type="button">
      Login with GitHub
    </button>

    <div id="error" class="error"></div>
  </main>

  <script>
    document.getElementById('login').addEventListener('click', () => {
      window.location.assign('/api/admin/login');
    });

    const auth = new URLSearchParams(
      window.location.search
    ).get('auth');

    if (auth === 'denied') {
      document.getElementById('error').textContent =
        'This GitHub account is not an approved admin.';
    } else if (auth === 'failed') {
      document.getElementById('error').textContent =
        'GitHub sign-in failed. Please try again.';
    }
  </script>
</body>
</html>
