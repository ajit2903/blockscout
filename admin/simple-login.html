<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1a1a2e">
  <title>Admin Login — Blockscout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    /* Logo / header */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 56px; height: 56px;
      background: #1a1a2e;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }

    .logo-icon svg { width: 32px; height: 32px; }

    .logo h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .logo p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #888;
    }

    /* Error */
    .err {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffc9c9;
      color: #c0392b;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 18px;
      text-align: center;
    }

    /* Form fields */
    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      /* Large touch target for mobile */
      padding: 16px 14px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      font-size: 16px; /* prevents iOS zoom on focus */
      color: #1a1a2e;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #0f3460;
      box-shadow: 0 0 0 3px rgba(15,52,96,.12);
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      /* Large touch target */
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active { transform: scale(.97); }

    .btn-primary { background: #1a1a2e; color: #fff; margin-top: 4px; }
    .btn-primary:hover { opacity: .88; }

    .btn-github {
      background: #f6f8fa;
      color: #1a1a2e;
      border: 1.5px solid #d0d7de;
      margin-top: 12px;
    }

    .btn-github:hover { background: #eef1f3; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 0;
      color: #bbb;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e8e8e8;
    }

    /* Footer link */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }

    .footer a { color: #0f3460; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Responsive: on very small screens reduce card padding */
    @media (max-width: 360px) {
      .card { padding: 28px 18px 20px; }
    }

    /* Show password toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 48px; }
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #888;
      font-size: 18px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 24L13 8L20 24M9.5 18H16.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="10" r="3.5" fill="#4a90e2"/>
        </svg>
      </div>
      <h1>Blockscout Admin</h1>
      <p>Sign in to your admin account</p>
    </div>

    <div id="err" class="err" role="alert"></div>

    <form method="POST" action="/admin/login" id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="authenticate[username]"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="password"
            name="authenticate[password]"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show/hide password">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="divider">or</div>

    <a class="btn btn-github" href="/api/admin/login">
      <svg height="22" width="22" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
          .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
          .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Login with GitHub
    </a>

    <div class="footer">
      First time? <a href="/admin/setup">Set up admin account</a>
    </div>

  </div>

  <script>
    // Show error from query params
    const p = new URLSearchParams(location.search);
    const msgs = {
      invalid_credentials: 'Wrong username or password.',
      denied: 'This GitHub account is not authorized.',
      failed: 'GitHub login failed. Please try again.',
      not_found: 'Admin not set up yet. Use the setup link below.'
    };
    const key = p.get('error') || (p.get('auth') === 'denied' ? 'denied' : p.get('auth') === 'failed' ? 'failed' : null);
    if (key && msgs[key]) {
      const e = document.getElementById('err');
      e.textContent = msgs[key];
      e.style.display = 'block';
    }

    // Password visibility toggle
    document.getElementById('pwToggle').addEventListener('click', function () {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      this.textContent = inp.type === 'password' ? '👁' : '🙈';
    });

    // Basic client-side validation
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      const u = document.getElementById('username').value.trim();
      const pw = document.getElementById('password').value;
      const err = document.getElementById('err');
      if (!u || !pw) {
        e.preventDefault();
        err.textContent = 'Please fill in both username and password.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
